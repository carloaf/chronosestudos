services:
  # ──────────────────────────────────────────────
  #  Apache + PHP 8.2 (Laravel)
  # ──────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: chronos_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chronos_network

  # ──────────────────────────────────────────────
  #  MariaDB 10.11
  # ──────────────────────────────────────────────
  db:
    image: mariadb:10.11
    container_name: chronos_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: chronosestudos
      MYSQL_USER: chronos
      MYSQL_PASSWORD: chronos_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chronos_network

  # ──────────────────────────────────────────────
  #  Node.js (Tailwind CSS assets)
  # ──────────────────────────────────────────────
  node:
    image: node:20-alpine
    container_name: chronos_node
    working_dir: /app
    volumes:
      - ./src:/app
    command: ["tail", "-f", "/dev/null"]
    networks:
      - chronos_network

volumes:
  db_data:
    driver: local

networks:
  chronos_network:
    driver: bridge
